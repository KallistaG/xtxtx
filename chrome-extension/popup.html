<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Verse to Flow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="eyebrow">DAILY SCRIPTURE</div>
    <h1>Bible Verse to Flow</h1>
    <section class="verse-card">
      <p id="verseText">Loading verse…</p>
      <strong id="reference"></strong>
    </section>
    <button id="another" class="secondary">Choose another verse</button>
    <button id="send" class="primary">Create image in Flow</button>
    <p id="status" role="status">Opens Flow and fills in a poster prompt.</p>
    <p class="note">You may need to sign in. Review the prompt and result in Flow before posting.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
